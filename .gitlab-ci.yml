# Comprobaciones en GitLab, por si la organización ofrece runners (docs/FLUJO_IA.md).
# Sin runners no corre nada: entonces se pasa `uv run python scripts/comprobar.py` en local.
stages: [pruebas]

python:
  stage: pruebas
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache]
  script:
    - uv sync --frozen --extra dev --extra api --extra ocr
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -q
    - uv run trazia lote examples/documents -o /tmp/trazia/salida --dataset synthetic

web:
  stage: pruebas
  image: node:22-bookworm-slim
  script:
    - corepack enable
    - cd web
    - corepack pnpm install --frozen-lockfile
    - corepack pnpm typecheck
    - corepack pnpm lint
    - corepack pnpm test:unit
    - corepack pnpm build
